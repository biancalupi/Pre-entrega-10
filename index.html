<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dietética Natural - Simulador de Compras</title>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>La Dietética Market</h1>
        <div id="banner-promocion" class="banner hidden"></div>
    </header>

    <main>
        <section id="simulador-compras">
            <h2>Simulador de Presupuesto</h2>

            <form id="form-pedido">
                <label for="producto">Seleccionar producto:</label>
                <select id="producto">
                    <option value="">Cargando catálogo...</option>
                </select>

                <label for="cantidad">Cantidad en gramos:</label>
                <input type="number" id="cantidad" placeholder="Ej: 250">

                <button type="submit">Calcular Total</button>
            </form>

            <div id="mensaje-estado"></div>
        </section>

        <section id="catalogo-productos">
            <h3>Catálogo Disponible</h3>
            <div id="contenedor-productos">
                <p id="cargando-texto">⏳ Cargando productos...</p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/main.js"></script>
</body>
</html>
